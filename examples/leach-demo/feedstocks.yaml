  mid:  {ni_pct: 18, co_pct: 6, li_pct: 3.5, mn_pct: 6, al_pct: 2, cu_pct: 1.5, graphite_pct: 35}
  high: {ni_pct: 24, co_pct: 8, li_pct: 4.5, mn_pct: 8, al_pct: 1, cu_pct: 1, graphite_pct: 30}
